<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>iENCH // TRANSMISSION 006</title>
<style>
:root{color-scheme:dark;--gold:#b99b6a;--dim:#68756e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060808;color:#b8b7a9;font-family:'Courier New',monospace}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff06 3px 4px);z-index:3}.wrap{max-width:760px;margin:0 auto;padding:32px 22px 70px}.top{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:2px;color:var(--dim);border-bottom:1px solid #3a372e;padding-bottom:20px}.hero{text-align:center;padding:70px 0 35px}.sigil{width:105px;height:105px;border:1px solid #8c7350;border-radius:50%;margin:0 auto 30px;display:grid;place-items:center;box-shadow:0 0 55px #ad855017;animation:pulse 4s infinite}.sigil:after{content:none}.sigil{width:min(290px,72vw);height:auto;aspect-ratio:2/3;border:0;border-radius:0;box-shadow:none;margin-bottom:12px}.sigil img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 14px #c65a152b)}@keyframes pulse{50%{box-shadow:0 0 75px #ad85503c}}h1{color:var(--gold);font-weight:normal;font-size:clamp(22px,5vw,36px);letter-spacing:4px;margin:0 0 16px}.sub{color:var(--dim);letter-spacing:3px;font-size:12px}.terminal{border:1px solid #403b2d;padding:24px;background:#0b0d0c;box-shadow:0 0 45px #000}.log{color:#82988c;font-size:12px;line-height:1.9;margin:0 0 24px;min-height:76px;white-space:pre-line}label{display:block;color:var(--gold);font-size:12px;letter-spacing:2px;margin-bottom:12px}.inputrow{display:flex;gap:10px}input{flex:1;min-width:0;padding:14px;background:#050706;border:1px solid #534b3b;color:#e5d4af;font:16px 'Courier New',monospace;outline:none}input:focus{border-color:var(--gold)}button{cursor:pointer;background:var(--gold);border:1px solid var(--gold);color:#080a08;font:700 12px 'Courier New',monospace;letter-spacing:1px;padding:14px 18px}button:hover{background:#dec292}button:disabled{opacity:.5;cursor:wait}.status{font-size:12px;min-height:22px;margin-top:16px;color:#b2a48b}.error{color:#e79c87}.success{color:#9fc5a3}.archives{display:none;margin-top:28px;border-top:1px solid #403b2d;padding-top:24px}.archives h2{font-weight:normal;color:var(--gold);font-size:15px;letter-spacing:3px}.track{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #282d28}.track .name{overflow-wrap:anywhere;font-size:14px}.track small{display:block;color:var(--dim);margin-top:6px}.track button{white-space:nowrap}.foot{text-align:center;color:#606f66;font-size:10px;letter-spacing:2px;margin-top:35px}@media(max-width:540px){.inputrow{flex-direction:column}.track{align-items:flex-start;flex-direction:column}.track button{width:100%}.hero{padding-top:45px}}

&gt; ARCHIVE STATUS: ENCRYPTED
&gt; AUTHENTICATION REQUIRED_</div><label for="key">ENTER ACCESS KEY_</label><div class="inputrow"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="SECRET KEY" aria-label="Clé secrète"><button id="unlock">DECRYPT</button></div><div class="status" id="status" role="status" aria-live="polite"></div><section class="archives" id="archives"><h2>RETRIEVED SIGNALS //</h2><div id="tracks"></div></section></section><footer class="foot">NO FACES // NO PUBLIC SIGNAL // ENANTEYA</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let manifest=null;let verifiedKey=null;
const encoder=new TextEncoder();
function b64bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
function status(message,type=''){ $('status').textContent=message;$('status').className='status '+type;}
async function derive(password,salt,iterations){const base=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(salt),iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decrypt(track,password){const key=await derive(password,track.salt,manifest.iterations);const r=await fetch('archives/'+encodeURIComponent(track.file),{cache:'no-store'});if(!r.ok)throw Error('Archive inaccessible ('+r.status+').');const buf=await r.arrayBuffer();return crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(track.iv)},key,buf);}
function download(buffer,name){const blob=new Blob([buffer],{type:'audio/wav'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function unlock(){const pw=$('key').value;if(!pw){status('ACCESS KEY REQUIRED','error');return;}const btn=$('unlock');btn.disabled=true;status('VERIFYING ENCRYPTION KEY...');try{if(!manifest){const r=await fetch('archives/manifest.json',{cache:'no-store'});if(!r.ok)throw Error('Manifeste introuvable.');manifest=await r.json();}if(!manifest.tracks?.length)throw Error('Aucune archive disponible.');if(manifest.iterations!==600000)throw Error('Paramètres de chiffrement non pris en charge.');const first=await decrypt(manifest.tracks[0],pw);verifiedKey=pw;$('key').value='';$('key').disabled=true;btn.style.display='none';$('archives').style.display='block';$('log').textContent='> KEY ACCEPTED\n> DECRYPTION COMPLETE\n> SIGNALS RELEASED_';status('ACCESS GRANTED // '+manifest.tracks.length+' ARCHIVE(S)','success');renderTracks();first=null;}catch(e){verifiedKey=null;status(e.name==='OperationError'?'ACCESS DENIED // INVALID KEY':e.message,'error');}finally{btn.disabled=false;}}
function renderTracks(){const root=$('tracks');root.replaceChildren();manifest.tracks.forEach((track,i)=>{const row=document.createElement('div');row.className='track';const info=document.createElement('div');info.className='name';info.textContent=String(i+1).padStart(2,'0')+' // '+track.title;const small=document.createElement('small');small.textContent=(track.bytes/1048576).toFixed(1)+' MB // WAV';info.appendChild(small);const btn=document.createElement('button');btn.textContent='DOWNLOAD .WAV';btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='DECRYPTING...';status('DECRYPTING '+track.title+' ...');try{const data=await decrypt(track,verifiedKey);download(data,track.name);status('DOWNLOAD READY // '+track.title,'success');}catch(e){status(e.name==='OperationError'?'DECRYPTION FAILED':e.message,'error');}finally{btn.disabled=false;btn.textContent='DOWNLOAD .WAV';}});row.append(info,btn);root.appendChild(row);});}
$('unlock').addEventListener('click',unlock);$('key').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});let counter=0;setInterval(()=>{$('counter').textContent=String(++counter).padStart(6,'0');},1000);
</script></body></html>
